services:
  vaultmanager:
    build:
      context: .
      args:
        SUPABASE_CLI_VERSION: "2.115.0"
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - COOKIE_SECURE=true
      - ADMIN_USERNAME
      - ADMIN_PASSWORD_HASH
      - APP_ENCRYPTION_KEY
      - BACKUP_STORAGE
      - BACKUP_CRON
      - CRON_TARGET_ID
      - S3_BUCKET
      - S3_REGION
      - S3_PREFIX
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
    volumes:
      - vaultmanager_data:/var/lib/vaultmanager
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  vaultmanager_data:
